name: Deploy Node Application

on: 
  push:
    branches:
      - Long

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}     
      - name: Build Docker Image
        run: docker build -t thanhlep/nodejs-web  .
      - name: Publish Image to docker hub
        run: docker push thanhlep/nodejs-web:latest 
 
  deploy:
    needs: build
    runs-on: self-hosted 
    steps:
      - name: Pull image from docker hub
        run: docker pull thanhlep/nodejs-web:latest 
      - name: Delete old container
        run: docker rm -f nodejs-web-container  
      - name: Run Docker Container
        run: docker run -d -p 8080:8080 --name nodejs-web-container -e MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD }}' thanhlep/nodejs-web